<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Gastos — Demo</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#14181C">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gastos">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Manrope:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --body-dark:#14181C;
    --panel:#1D242B;
    --panel-2:#232B33;
    --paper:#F2EEE2;
    --paper-line:#DCD6C4;
    --ink:#1B1B1B;
    --led-green:#39FF88;
    --led-amber:#FFB454;
    --led-red:#FF6B5E;
    --muted:#8A97A0;
    --muted-2:#5B666E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--body-dark);
    color:#EDEFF0;
    font-family:'Manrope',sans-serif;
    min-height:100vh;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0px, rgba(255,255,255,.015) 1px, transparent 1px, transparent 3px);
  }
  .app{max-width:920px;margin:0 auto;padding:28px 20px 80px;}

  .register{
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border-radius:18px;
    padding:22px 24px;
    box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 20px 40px -20px rgba(0,0,0,.6);
    border:1px solid rgba(255,255,255,.06);
  }
  .eyebrow{
    font-family:'Barlow Condensed',sans-serif;
    text-transform:uppercase;
    letter-spacing:.14em;
    font-size:12.5px;
    color:var(--muted);
    font-weight:700;
  }
  .register-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .month-select{
    background:transparent;border:1px solid rgba(255,255,255,.14);color:#EDEFF0;
    font-family:'Manrope';font-weight:600;font-size:13px;padding:7px 10px;border-radius:8px;
  }
  .total-led{
    font-family:'Space Mono',monospace;
    font-size:44px;font-weight:700;
    color:var(--led-green);
    text-shadow:0 0 6px rgba(57,255,136,.55), 0 0 22px rgba(57,255,136,.25);
    letter-spacing:1px;
    margin-top:2px;
  }
  .verdict{
    margin-top:10px;font-family:'Space Mono',monospace;font-size:13px;
    display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;
    background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08);
  }
  .verdict.up{color:var(--led-amber);}
  .verdict.down{color:var(--led-green);}
  .verdict.flat{color:var(--muted);}

  .tabs{display:flex;gap:8px;margin:22px 0 18px;}
  .tab{
    font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-weight:700;
    font-size:14px;padding:9px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.1);
    background:transparent;color:var(--muted);cursor:pointer;
  }
  .tab.active{background:var(--panel-2);color:#EDEFF0;border-color:rgba(255,255,255,.2);}

  .slot{
    border:1.5px dashed rgba(255,255,255,.22);
    border-radius:16px;
    padding:34px 20px;
    text-align:center;
    background:rgba(255,255,255,.02);
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .slot:hover{border-color:var(--led-green);background:rgba(57,255,136,.04);}
  .slot h3{margin:10px 0 4px;font-size:17px;}
  .slot p{margin:0;color:var(--muted);font-size:13.5px;}
  .slot .icon{font-size:30px;}
  input[type=file]{display:none;}

  .status{margin-top:14px;font-family:'Space Mono';font-size:12.5px;color:var(--muted);text-align:center;min-height:16px;}

  .confirm{
    background:var(--paper);color:var(--ink);border-radius:14px;padding:18px;margin-top:18px;
    font-family:'Manrope';
  }
  .confirm h4{margin:0 0 12px;font-family:'Barlow Condensed';text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:#6b6248;}
  .field{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--paper-line);align-items:center;}
  .field label{font-size:12.5px;color:#6b6248;font-family:'Space Mono';}
  .field input, .field select{
    font-family:'Space Mono';font-size:13.5px;border:none;background:transparent;text-align:right;color:var(--ink);
    width:60%;outline:none;border-bottom:1px solid transparent;
  }
  .field input:focus, .field select:focus{border-bottom:1px solid #6b6248;}
  .confirm-actions{display:flex;gap:10px;margin-top:14px;}
  .btn{
    font-family:'Barlow Condensed';text-transform:uppercase;letter-spacing:.06em;font-weight:700;font-size:13.5px;
    border-radius:9px;padding:9px 16px;border:none;cursor:pointer;
  }
  .btn-primary{background:var(--ink);color:var(--paper);}
  .btn-ghost{background:transparent;color:#6b6248;border:1px solid var(--paper-line);}

  .items-list{margin-top:6px;}
  .item-row{
    display:grid;grid-template-columns:1.4fr 1fr .7fr auto;gap:8px;align-items:center;
    padding:8px 0;border-bottom:1px dashed var(--paper-line);
  }
  .item-row input, .item-row select{
    font-family:'Space Mono';font-size:12.5px;border:1px solid var(--paper-line);background:#fff;color:var(--ink);
    border-radius:6px;padding:6px 8px;outline:none;width:100%;
  }
  .item-row .i-remove{
    background:none;border:none;color:#a05a4a;cursor:pointer;font-size:14px;padding:4px 6px;
  }
  @media(max-width:560px){
    .item-row{grid-template-columns:1fr 1fr;grid-template-rows:auto auto;}
    .item-row .i-remove{justify-self:end;}
  }

  .tape-wrap{margin-top:26px;}
  .tape-title{font-family:'Barlow Condensed';text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-size:13px;margin-bottom:10px;}
  .tape{background:var(--paper);border-radius:4px;position:relative;padding:14px 16px 4px;color:var(--ink);}
  .tape::before{
    content:'';position:absolute;top:-8px;left:0;right:0;height:16px;
    background-image:radial-gradient(circle,var(--body-dark) 8px,transparent 8.5px);
    background-size:18px 18px;background-position:1px -8px;background-repeat:repeat-x;
  }
  .receipt-row{border-bottom:1px dashed var(--paper-line);padding:10px 0;font-family:'Space Mono';font-size:12.8px;}
  .receipt-row .r1{display:flex;justify-content:space-between;font-weight:700;}
  .receipt-row .r2{display:flex;justify-content:space-between;color:#6b6248;margin-top:3px;}
  .empty{color:#8b8261;font-family:'Space Mono';font-size:12.5px;text-align:center;padding:24px 0;}

  .grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:6px;}
  @media(max-width:720px){.grid2{grid-template-columns:1fr;}}
  .card{background:var(--panel);border-radius:14px;padding:18px;border:1px solid rgba(255,255,255,.06);}
  .card h4{margin:0 0 12px;font-family:'Barlow Condensed';text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted);}
  .cat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13.5px;}
  .cat-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:6px;overflow:hidden;}
  .cat-bar > div{height:100%;background:var(--led-green);}
  .cat-bar > div.ok{background:var(--led-green);}
  .cat-bar > div.warn{background:var(--led-amber);}
  .cat-bar > div.over{background:var(--led-red);}
  .reset-link{display:block;text-align:center;margin-top:30px;font-family:'Space Mono';font-size:11.5px;color:var(--muted-2);cursor:pointer;text-decoration:underline;}

  .rubro-btn{
    background:transparent;border:1px solid rgba(255,255,255,.14);color:var(--muted);
    font-family:'Space Mono';font-size:11.5px;padding:6px 10px;border-radius:8px;cursor:pointer;
  }
  .rubro-btn:hover{color:#EDEFF0;border-color:rgba(255,255,255,.3);}
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:50;
  }
  .modal{background:var(--paper);color:var(--ink);border-radius:16px;padding:24px;max-width:380px;width:100%;}
  .modal h3{margin:0 0 4px;font-size:18px;}
  .modal p{margin:0 0 16px;color:#6b6248;font-size:13.5px;}
  .modal select{
    width:100%;font-family:'Space Mono';font-size:14px;padding:10px;border-radius:8px;
    border:1px solid var(--paper-line);background:#fff;color:var(--ink);margin-bottom:14px;
  }

  .badge-corregido{
    display:inline-block;font-family:'Space Mono';font-size:10.5px;color:var(--led-amber);
    border:1px solid rgba(255,180,84,.35);border-radius:6px;padding:1px 6px;margin-left:6px;
  }
  .flag-btn{
    background:none;border:none;cursor:pointer;font-size:13px;opacity:.4;padding:0 0 0 8px;
  }
  .flag-btn.flagged{opacity:1;}
  .edit-btn{
    background:none;border:none;cursor:pointer;font-size:12.5px;opacity:.4;padding:0 0 0 6px;
  }
  .edit-btn:hover{opacity:1;}
  .precision-stat{
    font-family:'Space Mono';font-size:12.5px;color:var(--muted);margin-bottom:14px;
    display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06);padding-bottom:10px;
  }
  .precision-stat b{color:#EDEFF0;}

  .price-row{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);}
  .price-name{font-size:13px;margin-bottom:5px;}
  .price-detail{display:flex;justify-content:space-between;align-items:center;font-family:'Space Mono';font-size:12px;color:var(--muted);}
  .price-detail .verdict{margin-top:0;padding:2px 8px;font-size:11.5px;}
</style>
</head>
<body>
<div class="app">

  <div class="register">
    <div class="register-top">
      <div>
        <div class="eyebrow">Total del mes</div>
        <div class="total-led" id="totalLed">$0.00</div>
        <div class="verdict flat" id="verdict">Sube tu primera factura para empezar</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end;">
        <select class="month-select" id="monthSelect"></select>
        <div style="display:flex;gap:6px;align-items:center;">
          <select class="month-select" id="workspaceSelect" style="max-width:160px;"></select>
          <button class="rubro-btn" id="addWorkspaceBtn" title="Crear otro espacio">+ espacio</button>
          <button class="rubro-btn" id="deleteWorkspaceBtn" title="Eliminar este espacio">🗑</button>
        </div>
        <button class="rubro-btn" id="budgetBtn" style="display:none;">✏️ presupuesto</button>
      </div>
    </div>
  </div>

  <div id="onboardingModal"></div>

  <div class="tabs">
    <button class="tab active" data-tab="registro">Registrar</button>
    <button class="tab" data-tab="analisis">Análisis mensual</button>
  </div>

  <div id="tab-registro">
    <label class="slot" id="slot">
      <div class="icon">🧾</div>
      <h3>Sube una foto o PDF de tu factura</h3>
      <p>La IA la lee y clasifica el producto, el valor y dónde lo compraste</p>
      <input type="file" id="fileInput" accept="image/*,application/pdf">
    </label>
    <div class="status" id="status"></div>

    <div id="confirmZone"></div>

    <div class="tape-wrap">
      <div class="tape-title" id="tapeTitle">Gastos de este mes</div>
      <div class="tape" id="tape"></div>
    </div>
  </div>

  <div id="tab-analisis" style="display:none;">
    <div class="grid2">
      <div class="card">
        <h4>Este mes vs. mes anterior</h4>
        <canvas id="compareChart" height="180"></canvas>
      </div>
      <div class="card">
        <h4>Por categoría (este mes)</h4>
        <div class="precision-stat" id="precisionStat"></div>
        <div id="catBreakdown"></div>
      </div>
    </div>
    <div class="grid2" style="margin-top:16px;">
      <div class="card">
        <h4>Gasto por lugar (este mes)</h4>
        <div id="providerBreakdown"></div>
      </div>
      <div class="card">
        <h4>Historial de precio por producto</h4>
        <div id="priceHistory"></div>
      </div>
    </div>
    <div class="grid2" id="budgetGrid" style="margin-top:16px; display:none;">
      <div class="card" style="grid-column: 1 / -1;">
        <h4>Presupuesto por porcentaje</h4>
        <div id="budgetBreakdown"></div>
      </div>
    </div>
  </div>

  <div class="reset-link" id="resetLink">borrar los gastos de este espacio</div>
</div>

<script>
const CATEGORY_SETS = {
  "Gastronomía": ["Alimentos","Bebidas","Insumos de cocina","Empaques","Servicios","Transporte","Otros"],
  "Mecánica": ["Repuestos","Herramientas","Insumos","Lubricantes","Servicios","Transporte","Otros"],
  "Retail / Moda": ["Mercadería","Empaques","Publicidad","Servicios","Transporte","Otros"],
  "Servicios profesionales": ["Suministros de oficina","Software / herramientas","Publicidad","Servicios","Transporte","Otros"],
  "Finanzas personales": ["Alimentación","Vivienda / arriendo","Transporte","Entretenimiento","Salud","Educación","Ropa","Suscripciones","Ahorro","Deudas","Otros"],
  "Otro": ["Alimentos","Transporte","Hogar","Insumos","Entretenimiento","Salud","Servicios","Otros"]
};
let workspaces = [];
let activeWorkspaceId = null;
let RUBRO = null;
let CATEGORIES = CATEGORY_SETS["Otro"];
let expenses = [];
let chartRef = null;
let pendingAI = null;
let INGRESO = 0;
let SPLIT = { necesidades:50, deseos:30, ahorro:20 };

const PERSONAL_BUCKETS = {
  "Vivienda / arriendo": "necesidades",
  "Alimentación": "necesidades",
  "Transporte": "necesidades",
  "Salud": "necesidades",
  "Deudas": "necesidades",
  "Entretenimiento": "deseos",
  "Ropa": "deseos",
  "Suscripciones": "deseos",
  "Otros": "deseos",
  "Ahorro": "ahorro"
};
const BUCKET_LABELS = { necesidades: "Necesidades", deseos: "Deseos", ahorro: "Ahorro" };

const monthKey = (d) => d.slice(0,7);
const monthLabel = (key) => {
  const [y,m] = key.split('-');
  const names = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  return names[parseInt(m,10)-1] + " " + y;
};
const fmt = (n) => "$" + n.toFixed(2);

async function initApp(){
  try{
    workspaces = JSON.parse(localStorage.getItem('workspaces') || '[]');
  }catch(e){
    workspaces = [];
  }
  try{
    activeWorkspaceId = localStorage.getItem('active-workspace') || null;
  }catch(e){
    activeWorkspaceId = null;
  }

  if(workspaces.length === 0){
    showCreateWorkspace(true);
    return;
  }
  if(!activeWorkspaceId || !workspaces.find(w => w.id === activeWorkspaceId)){
    activeWorkspaceId = workspaces[0].id;
  }
  populateWorkspaceSelect();
  await activateWorkspace(activeWorkspaceId);
}

function saveWorkspacesList(){
  try{ localStorage.setItem('workspaces', JSON.stringify(workspaces)); }catch(e){}
}

function populateWorkspaceSelect(){
  const sel = document.getElementById('workspaceSelect');
  sel.innerHTML = workspaces.map(w => `<option value="${w.id}" ${w.id===activeWorkspaceId?'selected':''}>${w.label}</option>`).join('');
}

document.getElementById('workspaceSelect').addEventListener('change', async (e) => {
  await activateWorkspace(e.target.value);
});

document.getElementById('addWorkspaceBtn').addEventListener('click', () => showCreateWorkspace(false));

document.getElementById('deleteWorkspaceBtn').addEventListener('click', async () => {
  if(workspaces.length <= 1){
    alert('Debe existir al menos un espacio.');
    return;
  }
  const current = workspaces.find(w => w.id === activeWorkspaceId);
  if(!confirm(`¿Eliminar el espacio "${current.label}" y todos sus gastos? Esto no se puede deshacer.`)) return;
  try{
    localStorage.removeItem('expenses-data:' + activeWorkspaceId);
    localStorage.removeItem('ingreso-mensual:' + activeWorkspaceId);
    localStorage.removeItem('budget-split:' + activeWorkspaceId);
  }catch(e){}
  workspaces = workspaces.filter(w => w.id !== activeWorkspaceId);
  saveWorkspacesList();
  populateWorkspaceSelect();
  await activateWorkspace(workspaces[0].id);
});

async function activateWorkspace(id){
  activeWorkspaceId = id;
  try{ localStorage.setItem('active-workspace', id); }catch(e){}

  const ws = workspaces.find(w => w.id === id);
  RUBRO = ws ? ws.rubro : null;
  CATEGORIES = CATEGORY_SETS[RUBRO] || CATEGORY_SETS['Otro'];

  try{
    const raw = localStorage.getItem('expenses-data:' + id);
    expenses = raw ? JSON.parse(raw) : [];
  }catch(e){
    expenses = [];
  }

  await loadBudget();
  updateBudgetBtnVisibility();
  populateWorkspaceSelect();
  populateMonthSelect();
  render();
}

function showCreateWorkspace(isFirst){
  const modal = document.getElementById('onboardingModal');
  const opts = Object.keys(CATEGORY_SETS);
  modal.innerHTML = `
    <div class="modal-overlay">
      <div class="modal">
        <h3>${isFirst ? '¿Cómo vas a usar esta app?' : 'Crear nuevo espacio'}</h3>
        <p>Cada espacio guarda sus propios gastos por separado — puedes tener uno para tu negocio y otro para tus finanzas personales.</p>
        <div class="field"><label>Nombre del espacio</label><input id="ws-label" placeholder="Ej. Mi negocio"></div>
        <select id="ws-rubro">${opts.map(o=>`<option>${o}</option>`).join('')}</select>
        <button class="btn btn-primary" id="wsSave" style="width:100%;margin-top:6px;">Continuar</button>
        ${!isFirst ? '<button class="btn btn-ghost" id="wsCancel" style="width:100%;margin-top:8px;">Cancelar</button>' : ''}
      </div>
    </div>
  `;
  document.getElementById('wsSave').onclick = async () => {
    const rubro = document.getElementById('ws-rubro').value;
    const label = document.getElementById('ws-label').value.trim() || rubro;
    const id = 'ws_' + Date.now();
    workspaces.push({ id, label, rubro });
    saveWorkspacesList();
    modal.innerHTML = '';
    await activateWorkspace(id);
    if(rubro === 'Finanzas personales'){
      showBudgetSetup();
    }
  };
  if(!isFirst){
    document.getElementById('wsCancel').onclick = () => modal.innerHTML = '';
  }
}

async function loadBudget(){
  try{
    INGRESO = parseFloat(localStorage.getItem('ingreso-mensual:' + activeWorkspaceId)) || 0;
  }catch(e){
    INGRESO = 0;
  }
  try{
    const raw = localStorage.getItem('budget-split:' + activeWorkspaceId);
    SPLIT = raw ? JSON.parse(raw) : { necesidades:50, deseos:30, ahorro:20 };
  }catch(e){
    SPLIT = { necesidades:50, deseos:30, ahorro:20 };
  }
}

async function saveBudget(ingreso, split){
  INGRESO = ingreso;
  SPLIT = split;
  try{
    localStorage.setItem('ingreso-mensual:' + activeWorkspaceId, String(ingreso));
    localStorage.setItem('budget-split:' + activeWorkspaceId, JSON.stringify(split));
  }catch(e){
    console.error('No se pudo guardar el presupuesto', e);
  }
}

function updateBudgetBtnVisibility(){
  document.getElementById('budgetBtn').style.display = (RUBRO === 'Finanzas personales') ? 'inline-block' : 'none';
}

document.getElementById('budgetBtn').addEventListener('click', showBudgetSetup);

function showBudgetSetup(){
  const modal = document.getElementById('onboardingModal');
  modal.innerHTML = `
    <div class="modal-overlay">
      <div class="modal">
        <h3>Reparte tu ingreso</h3>
        <p>Regla clásica 50/30/20: necesidades, deseos y ahorro. Ajusta los porcentajes si quieres.</p>
        <div class="field"><label>Ingreso mensual aprox.</label><input id="b-ingreso" type="number" step="0.01" value="${INGRESO || ''}" placeholder="$"></div>
        <div class="field"><label>% Necesidades</label><input id="b-nec" type="number" value="${SPLIT.necesidades}"></div>
        <div class="field"><label>% Deseos</label><input id="b-des" type="number" value="${SPLIT.deseos}"></div>
        <div class="field"><label>% Ahorro</label><input id="b-ahorro" type="number" value="${SPLIT.ahorro}"></div>
        <button class="btn btn-primary" id="budgetSave" style="width:100%;margin-top:8px;">Guardar</button>
      </div>
    </div>
  `;
  document.getElementById('budgetSave').onclick = async () => {
    const ingreso = parseFloat(document.getElementById('b-ingreso').value) || 0;
    const nec = parseFloat(document.getElementById('b-nec').value) || 0;
    const des = parseFloat(document.getElementById('b-des').value) || 0;
    const ahorro = parseFloat(document.getElementById('b-ahorro').value) || 0;
    await saveBudget(ingreso, { necesidades:nec, deseos:des, ahorro:ahorro });
    modal.innerHTML = '';
    render();
  };
}

async function saveExpenses(){
  try{
    localStorage.setItem('expenses-data:' + activeWorkspaceId, JSON.stringify(expenses));
  }catch(e){
    console.error('No se pudo guardar', e);
  }
}

function populateMonthSelect(){
  const sel = document.getElementById('monthSelect');
  const months = Array.from(new Set(expenses.map(e => monthKey(e.fecha)))).sort().reverse();
  const current = monthKey(new Date().toISOString());
  if(!months.includes(current)) months.unshift(current);
  sel.innerHTML = months.map(m => `<option value="${m}">${monthLabel(m)}</option>`).join('');
  sel.value = current;
  sel.onchange = render;
}

function getSelectedMonth(){
  return document.getElementById('monthSelect').value;
}

function prevMonthKey(key){
  const [y,m] = key.split('-').map(Number);
  const d = new Date(y, m-2, 1);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,'0');
}

function render(){
  const month = getSelectedMonth();
  const thisMonth = expenses.filter(e => monthKey(e.fecha) === month);
  const prevKey = prevMonthKey(month);
  const prevMonthExp = expenses.filter(e => monthKey(e.fecha) === prevKey);

  const total = thisMonth.reduce((s,e)=>s+e.valor,0);
  const prevTotal = prevMonthExp.reduce((s,e)=>s+e.valor,0);

  document.getElementById('totalLed').textContent = fmt(total);

  const verdictEl = document.getElementById('verdict');
  if(prevTotal === 0 || thisMonth.length === 0){
    verdictEl.className = 'verdict flat';
    verdictEl.textContent = thisMonth.length === 0 ? 'Sin gastos registrados este mes' : 'Sin datos del mes anterior para comparar';
  } else {
    const diff = ((total - prevTotal) / prevTotal) * 100;
    if(Math.abs(diff) < 1){
      verdictEl.className = 'verdict flat';
      verdictEl.textContent = 'Gastaste casi igual que el mes pasado';
    } else if(diff > 0){
      verdictEl.className = 'verdict up';
      verdictEl.textContent = `▲ ${diff.toFixed(1)}% más que el mes pasado`;
    } else {
      verdictEl.className = 'verdict down';
      verdictEl.textContent = `▼ ${Math.abs(diff).toFixed(1)}% menos que el mes pasado`;
    }
  }

  document.getElementById('tapeTitle').textContent = `Gastos de ${monthLabel(month)}`;
  const tape = document.getElementById('tape');
  if(thisMonth.length === 0){
    tape.innerHTML = '<div class="empty">Aún no hay facturas registradas este mes</div>';
  } else {
    tape.innerHTML = thisMonth.slice().reverse().map((e,i) => {
      const realIdx = expenses.indexOf(e);
      return `
      <div class="receipt-row">
        <div class="r1">
          <span>${e.producto}${e.aiCorregido ? '<span class="badge-corregido">corregido</span>' : ''}</span>
          <span>${fmt(e.valor)}<button class="flag-btn ${e.flagged?'flagged':''}" data-idx="${realIdx}" title="Marcar que esta clasificación no sirvió">👎</button><button class="edit-btn" data-idx="${realIdx}" title="Editar o eliminar">✎</button></span>
        </div>
        <div class="r2"><span>${e.categoria} · ${e.tienda}</span><span>${e.fecha}</span></div>
      </div>
    `;
    }).join('');
    tape.querySelectorAll('.flag-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const idx = parseInt(btn.dataset.idx, 10);
        expenses[idx].flagged = !expenses[idx].flagged;
        await saveExpenses();
        render();
      });
    });
    tape.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.idx, 10);
        showEditExpense(idx);
        document.getElementById('confirmZone').scrollIntoView({ behavior:'smooth' });
      });
    });
  }

  renderAnalysis(thisMonth, prevMonthExp, month, prevKey);
}

function showEditExpense(idx){
  const e = expenses[idx];
  const zone = document.getElementById('confirmZone');
  zone.innerHTML = `
    <div class="confirm">
      <h4>Editar gasto</h4>
      <div class="field"><label>Producto</label><input id="e-producto" value="${e.producto}"></div>
      <div class="field"><label>Categoría</label>
        <select id="e-categoria">${CATEGORIES.map(c=>`<option ${c===e.categoria?'selected':''}>${c}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Valor</label><input id="e-valor" type="number" step="0.01" value="${e.valor}"></div>
      <div class="field"><label>Tienda / lugar</label><input id="e-tienda" value="${e.tienda}"></div>
      <div class="field"><label>Fecha</label><input id="e-fecha" type="date" value="${e.fecha}"></div>
      <div class="confirm-actions">
        <button class="btn btn-primary" id="editSaveBtn">Guardar cambios</button>
        <button class="btn btn-ghost" id="editDeleteBtn" style="color:#a05a4a;">Eliminar</button>
        <button class="btn btn-ghost" id="editCancelBtn">Cancelar</button>
      </div>
    </div>
  `;
  document.getElementById('editSaveBtn').onclick = async () => {
    expenses[idx].producto = document.getElementById('e-producto').value || 'Sin nombre';
    expenses[idx].categoria = document.getElementById('e-categoria').value;
    expenses[idx].valor = parseFloat(document.getElementById('e-valor').value) || 0;
    expenses[idx].tienda = document.getElementById('e-tienda').value || 'No especificado';
    expenses[idx].fecha = document.getElementById('e-fecha').value;
    await saveExpenses();
    zone.innerHTML = '';
    populateMonthSelect();
    render();
  };
  document.getElementById('editDeleteBtn').onclick = async () => {
    if(!confirm('¿Eliminar este gasto?')) return;
    expenses.splice(idx, 1);
    await saveExpenses();
    zone.innerHTML = '';
    populateMonthSelect();
    render();
  };
  document.getElementById('editCancelBtn').onclick = () => zone.innerHTML = '';
}

function renderAnalysis(thisMonth, prevMonthExp, month, prevKey){
  const byCat = (list) => {
    const m = {};
    CATEGORIES.forEach(c => m[c] = 0);
    list.forEach(e => m[e.categoria] = (m[e.categoria]||0) + e.valor);
    return m;
  };
  const thisCat = byCat(thisMonth);
  const prevCat = byCat(prevMonthExp);
  const maxCat = Math.max(1, ...Object.values(thisCat));

  const evaluable = thisMonth.filter(e => e.aiCorregido !== null && e.aiCorregido !== undefined);
  const sinCorregir = evaluable.filter(e => !e.aiCorregido).length;
  const flagged = thisMonth.filter(e => e.flagged).length;
  const precisionEl = document.getElementById('precisionStat');
  if(evaluable.length === 0){
    precisionEl.innerHTML = `<span>Precisión de la IA</span><b>sin datos aún</b>`;
  } else {
    const pct = ((sinCorregir/evaluable.length)*100).toFixed(0);
    precisionEl.innerHTML = `<span>Precisión de la IA (sin corrección)</span><b>${pct}%${flagged>0 ? ` · ${flagged} marcados 👎` : ''}</b>`;
  }

  const breakdown = document.getElementById('catBreakdown');
  breakdown.innerHTML = CATEGORIES.filter(c => thisCat[c] > 0 || prevCat[c] > 0).map(c => `
    <div class="cat-row">
      <span>${c}</span><span>${fmt(thisCat[c])}</span>
    </div>
    <div class="cat-bar"><div style="width:${(thisCat[c]/maxCat*100).toFixed(0)}%"></div></div>
  `).join('') || '<div class="empty" style="padding:8px 0;">Sin datos aún</div>';

  const ctx = document.getElementById('compareChart');
  const activeCats = CATEGORIES.filter(c => thisCat[c] > 0 || prevCat[c] > 0);
  if(chartRef) chartRef.destroy();
  chartRef = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: activeCats.length ? activeCats : ['Sin datos'],
      datasets: [
        { label: monthLabel(prevKey), data: activeCats.map(c=>prevCat[c]) || [0], backgroundColor: 'rgba(138,151,160,.35)' },
        { label: monthLabel(month), data: activeCats.map(c=>thisCat[c]) || [0], backgroundColor: '#39FF88' }
      ]
    },
    options: {
      responsive:true,
      plugins:{ legend:{ labels:{ color:'#EDEFF0', font:{family:'Manrope', size:11} } } },
      scales:{
        x:{ ticks:{ color:'#8A97A0', font:{size:10} }, grid:{ display:false } },
        y:{ ticks:{ color:'#8A97A0' }, grid:{ color:'rgba(255,255,255,.06)' } }
      }
    }
  });

  renderProviderBreakdown(thisMonth);
  renderPriceHistory();
  renderBudgetBreakdown(thisMonth);
}

function renderBudgetBreakdown(thisMonth){
  const grid = document.getElementById('budgetGrid');
  if(RUBRO !== 'Finanzas personales' || !INGRESO){
    grid.style.display = 'none';
    return;
  }
  grid.style.display = 'grid';
  const totals = { necesidades:0, deseos:0, ahorro:0 };
  thisMonth.forEach(e => {
    const bucket = PERSONAL_BUCKETS[e.categoria] || 'deseos';
    totals[bucket] += e.valor;
  });
  const el = document.getElementById('budgetBreakdown');
  el.innerHTML = Object.keys(BUCKET_LABELS).map(key => {
    const pct = SPLIT[key] || 0;
    const allowed = INGRESO * (pct / 100);
    const spent = totals[key];
    const ratio = allowed > 0 ? (spent / allowed) : 0;
    const cls = ratio > 1 ? 'over' : (ratio > 0.9 ? 'warn' : 'ok');
    const width = Math.min(ratio, 1) * 100;
    return `
      <div class="cat-row"><span>${BUCKET_LABELS[key]} (${pct}% · presupuesto ${fmt(allowed)})</span><span>${fmt(spent)}</span></div>
      <div class="cat-bar"><div class="${cls}" style="width:${width.toFixed(0)}%"></div></div>
    `;
  }).join('');
}

function renderProviderBreakdown(thisMonth){
  const byProv = {};
  thisMonth.forEach(e => {
    const key = e.tienda || 'No especificado';
    byProv[key] = (byProv[key] || 0) + e.valor;
  });
  const entries = Object.entries(byProv).sort((a,b) => b[1] - a[1]);
  const max = Math.max(1, ...entries.map(e => e[1]));
  const el = document.getElementById('providerBreakdown');
  if(entries.length === 0){
    el.innerHTML = '<div class="empty" style="padding:8px 0;">Sin datos aún</div>';
    return;
  }
  el.innerHTML = entries.map(([name, total]) => `
    <div class="cat-row"><span>${name}</span><span>${fmt(total)}</span></div>
    <div class="cat-bar"><div style="width:${(total/max*100).toFixed(0)}%"></div></div>
  `).join('');
}

function renderPriceHistory(){
  const groups = {};
  expenses.forEach(e => {
    const key = (e.producto || '').trim().toLowerCase();
    if(!key) return;
    if(!groups[key]) groups[key] = [];
    groups[key].push({ valor: e.valor, fecha: e.fecha, producto: e.producto });
  });

  const rows = [];
  Object.values(groups).forEach(list => {
    if(list.length < 2) return;
    list.sort((a,b) => a.fecha.localeCompare(b.fecha));
    const prev = list[list.length - 2];
    const last = list[list.length - 1];
    if(prev.valor === 0) return;
    const diffPct = ((last.valor - prev.valor) / prev.valor) * 100;
    rows.push({ producto: last.producto, prev: prev.valor, last: last.valor, diffPct });
  });
  rows.sort((a,b) => Math.abs(b.diffPct) - Math.abs(a.diffPct));
  const top = rows.slice(0, 6);

  const el = document.getElementById('priceHistory');
  if(top.length === 0){
    el.innerHTML = '<div class="empty" style="padding:8px 0;">Compra el mismo producto más de una vez para ver su historial de precio</div>';
    return;
  }
  el.innerHTML = top.map(r => {
    const up = r.diffPct > 0.5;
    const down = r.diffPct < -0.5;
    const cls = up ? 'up' : (down ? 'down' : 'flat');
    const arrow = up ? '▲' : (down ? '▼' : '≈');
    return `
      <div class="price-row">
        <div class="price-name">${r.producto}</div>
        <div class="price-detail">
          <span>${fmt(r.prev)} → ${fmt(r.last)}</span>
          <span class="verdict ${cls}">${arrow} ${Math.abs(r.diffPct).toFixed(1)}%</span>
        </div>
      </div>
    `;
  }).join('');
}

document.getElementById('fileInput').addEventListener('change', handleFile);

function fileToBase64(file){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = () => rej(new Error('No se pudo leer el archivo'));
    r.readAsDataURL(file);
  });
}

async function handleFile(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('status');
  statusEl.textContent = 'Leyendo y clasificando la factura...';

  try{
    const base64 = await fileToBase64(file);
    const isPdf = file.type === 'application/pdf';

    const today = new Date().toISOString().slice(0,10);

    const response = await fetch('/api/clasificar', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        base64,
        mediaType: file.type,
        isPdf,
        rubro: RUBRO,
        categorias: CATEGORIES,
        fechaHoy: today
      })
    });
    const parsed = await response.json();

    if(!response.ok || parsed.error){
      throw new Error(parsed.error || `Error ${response.status} al leer el documento`);
    }

    const items = (parsed.items || []).map(it => ({
      producto: it.producto || '',
      categoria: CATEGORIES.includes(it.categoria) ? it.categoria : CATEGORIES[CATEGORIES.length-1],
      valor: parseFloat(it.valor) || 0
    }));
    if(items.length === 0) items.push({ producto:'', categoria: CATEGORIES[CATEGORIES.length-1], valor: 0 });

    pendingAI = { tienda: parsed.tienda || '', fecha: parsed.fecha || today, items: items.map(i=>({...i})) };
    statusEl.textContent = '';
    showConfirmItems({ tienda: parsed.tienda || '', fecha: parsed.fecha || today, items });
  }catch(e){
    console.error(e);
    statusEl.textContent = 'No se pudo leer automáticamente (' + e.message + '). Ingresa los datos manualmente abajo.';
    pendingAI = null;
    showConfirmItems({ tienda:'', fecha:new Date().toISOString().slice(0,10), items:[{ producto:'', categoria:CATEGORIES[CATEGORIES.length-1], valor:0 }] });
  }finally{
    ev.target.value = '';
  }
}

function showConfirmItems(data){
  const zone = document.getElementById('confirmZone');
  let rows = data.items.map(it => ({ ...it }));

  function renderRows(){
    const rowsHtml = rows.map((it, idx) => `
      <div class="item-row" data-idx="${idx}">
        <input class="i-producto" placeholder="Producto" value="${it.producto}">
        <select class="i-categoria">${CATEGORIES.map(c=>`<option ${c===it.categoria?'selected':''}>${c}</option>`).join('')}</select>
        <input class="i-valor" type="number" step="0.01" value="${it.valor}">
        <button class="i-remove" title="Quitar este producto">✕</button>
      </div>
    `).join('');
    zone.innerHTML = `
      <div class="confirm">
        <h4>Confirma los datos antes de guardar</h4>
        <div class="field"><label>Tienda / lugar</label><input id="f-tienda" value="${data.tienda}"></div>
        <div class="field"><label>Fecha</label><input id="f-fecha" type="date" value="${data.fecha}"></div>
        <div class="items-list">${rowsHtml}</div>
        <button class="btn btn-ghost" id="addItemBtn" style="margin-top:8px;">+ Agregar producto</button>
        <div class="confirm-actions">
          <button class="btn btn-primary" id="saveBtn">Guardar todo</button>
          <button class="btn btn-ghost" id="cancelBtn">Cancelar</button>
        </div>
      </div>
    `;
    zone.querySelectorAll('.item-row').forEach(rowEl => {
      const idx = parseInt(rowEl.dataset.idx, 10);
      rowEl.querySelector('.i-producto').addEventListener('input', e => rows[idx].producto = e.target.value);
      rowEl.querySelector('.i-categoria').addEventListener('change', e => rows[idx].categoria = e.target.value);
      rowEl.querySelector('.i-valor').addEventListener('input', e => rows[idx].valor = parseFloat(e.target.value) || 0);
      rowEl.querySelector('.i-remove').addEventListener('click', () => {
        rows.splice(idx, 1);
        if(rows.length === 0) rows.push({ producto:'', categoria:CATEGORIES[CATEGORIES.length-1], valor:0 });
        renderRows();
      });
    });
    document.getElementById('addItemBtn').addEventListener('click', () => {
      rows.push({ producto:'', categoria:CATEGORIES[CATEGORIES.length-1], valor:0 });
      renderRows();
    });
    document.getElementById('saveBtn').addEventListener('click', async () => {
      const tienda = document.getElementById('f-tienda').value || 'No especificado';
      const fecha = document.getElementById('f-fecha').value;
      rows.forEach((r, idx) => {
        const entry = {
          producto: r.producto || 'Sin nombre',
          categoria: r.categoria,
          valor: r.valor,
          tienda,
          fecha,
          flagged: false
        };
        const aiItem = pendingAI && pendingAI.items[idx];
        if(aiItem){
          const cambios = (entry.producto.trim() !== (aiItem.producto||'').trim())
            || (entry.categoria !== aiItem.categoria)
            || (Math.abs(entry.valor - aiItem.valor) > 0.01);
          entry.aiCorregido = cambios;
        } else {
          entry.aiCorregido = null;
        }
        expenses.push(entry);
      });
      pendingAI = null;
      await saveExpenses();
      zone.innerHTML = '';
      populateMonthSelect();
      render();
    });
    document.getElementById('cancelBtn').addEventListener('click', () => zone.innerHTML = '');
  }

  renderRows();
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-registro').style.display = btn.dataset.tab === 'registro' ? 'block' : 'none';
    document.getElementById('tab-analisis').style.display = btn.dataset.tab === 'analisis' ? 'block' : 'none';
    if(btn.dataset.tab === 'analisis') render();
  });
});

document.getElementById('resetLink').addEventListener('click', async () => {
  const ws = workspaces.find(w => w.id === activeWorkspaceId);
  if(!confirm(`¿Borrar todos los gastos del espacio "${ws ? ws.label : ''}"? (el espacio y el presupuesto se mantienen)`)) return;
  expenses = [];
  await saveExpenses();
  populateMonthSelect();
  render();
});

initApp();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
